<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MA2K Responsive Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #ddd7cc; color: #16251e; font: 14px Arial,sans-serif; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; }
    .viewports { display: flex; align-items: start; gap: 24px; width: max-content; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    iframe { display: block; border: 0; background: #f3ecdf; box-shadow: 0 4px 24px #0002; }
  </style>
</head>
<body>
  <h1>MA2K responsive review</h1>
  <p>The live website at phone and tablet widths. <a href="/">Open the full website</a>.</p>
  <div class="viewports">
    <section><h2>Phone / 390 pixels</h2><iframe id="phone" title="Phone preview" src="/" width="390" height="844"></iframe></section>
    <section><h2>Tablet / 768 pixels</h2><iframe id="tablet" title="Tablet preview" src="/" width="768" height="1024"></iframe></section>
  </div>
</body>
</html>
